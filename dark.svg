<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Premium terminal-style profile banner for Yaseen Haider with visual identity panel and system information panel in dark theme.">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#10192d"/>
      <animate attributeName="x1" values="0%;8%;0%" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;92%;100%" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="panelDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2338" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#121a2d" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="accentDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b7dff"/>
      <stop offset="55%" stop-color="#4fd7ff"/>
      <stop offset="100%" stop-color="#4fffb2"/>
      <animate attributeName="x1" values="0%;20%;0%" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;80%;100%" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="scanDark" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" fill="#9db6ff" fill-opacity="0.08"/>
    </pattern>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

