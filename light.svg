    <rect x="58" y="498" width="352" height="56" rx="10" fill="#f0f5ff" stroke="#b4c7ed"/>
    <text x="72" y="521" fill="#385787" font-size="13" font-family="SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace">focused on clean apps, OOP, DSA,</text>
    <text x="72" y="541" fill="#385787" font-size="13" font-family="SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace">semester projects, Flutter mobile.</text>
