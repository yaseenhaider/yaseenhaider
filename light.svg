<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Premium terminal-style profile banner for Yaseen Haider with visual identity panel and system information panel in light theme.">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f9ff"/>
      <stop offset="100%" stop-color="#edf3ff"/>
      <animate attributeName="x1" values="0%;6%;0%" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;94%;100%" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="panelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f3f7ff" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#705ef2"/>
      <stop offset="55%" stop-color="#16a3d8"/>
      <stop offset="100%" stop-color="#11b581"/>
      <animate attributeName="x1" values="0%;18%;0%" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;82%;100%" dur="11s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="scanLight" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" fill="#5674b8" fill-opacity="0.08"/>
    </pattern>
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

